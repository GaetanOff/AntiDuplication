plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'net.minecrell.plugin-yml.bukkit' version '0.5.3'
}

group = 'fr.gaetandev.antiduplication'
version = '0.1'
description = 'AntiDuplication'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://mvnrepository.com/artifact/com.github.azbh111/craftbukkit-1.8.8'
    }
}

dependencies {
    compileOnly group: 'com.github.azbh111', name: 'craftbukkit-1.8.8', version: 'R'
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    compileOnly 'org.github.paperspigot:paperspigot-api:1.8.8-R0.1-SNAPSHOT'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'redis.clients:jedis:4.2.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.6.1'
    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    testImplementation 'org.github.paperspigot:paperspigot-api:1.8.8-R0.1-SNAPSHOT'
    testImplementation 'org.bukkit:bukkit:1.8.8-R0.1-SNAPSHOT'
    testImplementation group: 'com.github.azbh111', name: 'craftbukkit-1.8.8', version: 'R'
}

bukkit {
    name = 'AntiDuplication'
    main = 'fr.gaetandev.antiduplication.AntiDuplicationPlugin'
    version = project.version
    author = 'GaetanDev.fr'
    description = project.description
    apiVersion = '1.13'
    softDepend = ['Vault']

    commands {
        register('antidupe') {
            description = 'Admin commands for the anti-duplication plugin'
            usage = '/antidupe <scan|stats|reload>'
            permission = 'antiduplication.admin'
            permissionMessage = '§cYou do not have permission to use this command.'
        }
    }

    permissions {
        register('antiduplication.admin') {
            description = 'Access to admin commands'
            setDefault('OP')
        }
        register('antiduplication.bypass') {
            description = 'Bypass checks (not recommended)'
            setDefault('FALSE')
        }
    }
}

shadowJar {
    relocate 'com.google.gson', 'fr.antiduplication.libs.gson'
    relocate 'redis.clients.jedis', 'fr.antiduplication.libs.jedis'

    archiveClassifier.set('')
    archiveFileName = "${project.name}-${project.version}.jar"
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

tasks.build.dependsOn shadowJar
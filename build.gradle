plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'net.minecrell.plugin-yml.bukkit' version '0.6.0'
}

group = 'fr.gaetandev.antiduplication'
version = '1.0.0'
description = 'AntiDuplication'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // The plugin only compiles against the Bukkit API: every version-specific
    // access (NBT, persistent data container) goes through reflection so that a
    // single jar runs on 1.8 up to the latest release.
    compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'redis.clients:jedis:4.2.3'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

    testImplementation 'org.mockito:mockito-core:4.6.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.6.1'

    testImplementation 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'

    testImplementation 'org.assertj:assertj-core:3.22.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

bukkit {
    name = 'AntiDuplication'
    main = 'fr.gaetandev.antiduplication.AntiDuplicationPlugin'
    version = project.version
    author = 'GaetanDev.fr'
    description = project.description
    website = 'https://gaetandev.fr'
    // No api-version on purpose: the plugin supports 1.8, where the field does
    // not exist, and it never references version-specific Material constants.

    commands {
        register('antidupe') {
            description = 'Admin commands for the anti-duplication plugin'
            usage = '/antidupe <scan|stats|check|reload|version|debug|help>'
            permission = 'antiduplication.admin'
            permissionMessage = '§cYou do not have permission to use this command.'
        }
    }

    permissions {
        register('antiduplication.admin') {
            description = 'Access to admin commands and duplication alerts'
            setDefault('OP')
        }
        register('antiduplication.bypass') {
            description = 'Bypass checks (not recommended)'
            setDefault('FALSE')
        }
    }
}

shadowJar {
    relocate 'com.google.gson', 'fr.gaetandev.antiduplication.libs.gson'
    relocate 'redis.clients.jedis', 'fr.gaetandev.antiduplication.libs.jedis'
    relocate 'org.apache.commons.pool2', 'fr.gaetandev.antiduplication.libs.pool2'

    archiveClassifier.set('')
    archiveFileName = "${project.name}-${project.version}.jar"
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

tasks.build.dependsOn shadowJar
